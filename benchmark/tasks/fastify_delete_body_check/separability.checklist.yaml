# Separability checklist for fastify_delete_body_check (fastify_contenttype, Phase 4).
schema_version: 1
task_id: fastify_delete_body_check

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the framework attempts to parse the body and fails — returning a 415
      or a parse error." Acceptance: skip parsing when no body present, call handler.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid transfer-encoding/content-length/contentTypeParser.run?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'the request-handling path for DELETE and OPTIONS methods'"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming handleRequest.js?"
    answer: yes
    evidence: "instruction says 'the request-handling path for DELETE and OPTIONS methods'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = negate the body-indicator check (parse when NO body — real 'just invert the
      inner condition' logic error); B = revert to original contentType===undefined check
      (real 'the original check was fine, just restructure' incomplete fix).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails via parsing-when-no-body (negated condition); B fails via parsing-when-contentType-set
      (original condition). Both wrong (parser triggered for no-body request), different reason.
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "9-line source change. base-fail expected (DELETE with Content-Type but no body triggers parser)."
