  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: multipart header parameter encoding. The decision: Content-Disposition header params
    (name, filename) must be encoded per HTML5 form encoding (RFC 7578 §4.2 + WHATWG form
    encoding), which percent-encodes control characters (0x00-0x1F except 0x1B), escapes
    backslashes, and percent-encodes double quotes — NOT urllib quote() (which uses a different
    safe set).
  plausible_path_correct: >
    Replace urllib quote() with a regex-based encoder that applies the HTML5 form encoding
    replacement table (backslash -> \\, double-quote -> %22, control chars 0x00-0x1F except
    0x1B -> %XX). Build the Content-Disposition header by concatenating the formatted params.
  plausible_path_competing: >
    Keep urllib quote() but add the missing characters to the safe set. This partially fixes
    encoding but doesn't match the HTML5 spec (backslash handling differs, control chars
    handled differently). Looks correct (urllib quote is the standard URL encoder) but wrong spec.
  why_instruction_does_not_disambiguate: >
    The instruction says the symptom (non-ASCII filenames in multipart uploads are incorrectly
    encoded, causing garbled headers on the server) and the expectation (encode per the HTML5
    form encoding spec). It does NOT name the replacement table, the regex, _format_param,
    or which characters to escape.
  why_correct_history_selects_path: >
    The HTML5 form encoding spec is the authoritative reference for multipart form-data header
    params. The regex + replacement table approach is the standard implementation.
  why_wrong_history_is_plausible: >
    urllib quote() is the standard URL encoder and is already used in the base code. "Just fix
    the safe set" is a reasonable incremental fix.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: passed         # materialized 4/4 (agent-built, verified)
  verification_tier: executable_candidate
  intervention_preflight: pending

notes: >
