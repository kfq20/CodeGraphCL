notes: >
  T_A -> T_B parity edge. T_A's start_tls contract lives in the code tree
  (base.py abstract stub + asyncio.py impl), NOT in the prompt — a Reset agent
  can re-derive it by reading. Edge is beneficial-not-required (signal expected
  in cost + negative transfer, not pass-rate). Original N=3 result: negative
  transfer verified (wrong arm reward=0), positive transfer not observed
  (correct ~= irrelevant ~= reset on pass-rate). Edge status: partial /
