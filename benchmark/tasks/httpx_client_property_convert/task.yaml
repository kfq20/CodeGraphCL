  url: https://github.com/encode/httpx
  base_commit: "1f4b8dd054009f43a5a2c2fd7e38cbf7a539bb2f"
  gold_commit: "9e420a5c348f8f05124a0918e229acb8bf88acec"
  language: python

instruction:
  path: instruction.md

environment:
  image: codegraphcl-httpx:py311
  dockerfile: harbor_task/environment/Dockerfile.httpx
  workdir: /workspace/repo
  build_timeout_sec: 900
  extra_mounts:
