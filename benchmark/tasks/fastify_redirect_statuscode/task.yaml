schema_version: 1
task_id: fastify_redirect_statuscode
family_id: fastify_reply_api

repository:
  url: https://github.com/fastify/fastify
  base_commit: 92f474ea8c98^      # parent of the fix
  gold_commit: 92f474ea8c98
  language: javascript

instruction:
  path: instruction.md

environment:
  image: codegraphcl-fastify:node
  dockerfile: harbor_task/environment/Dockerfile.fastify
  workdir: /workspace/repo
  build_timeout_sec: 900
  extra_mounts: {}

patches:
  gold: gold.patch                 # lib/reply.js (track _hasStatusCode, use it in redirect)
  verifier: verifier/verifier.patch # test/internals/reply.test.js (redirect-code-before-call tests)

verifier:
  command: bash verifier/test.sh   # tap internals/reply.test.js --grep "redirect to" (cases 1-9)
  timeout_sec: 300
  hermetic: false
  fail_to_pass:
    - "test: redirect to `/` - 6 (preset 307 preserved)"
    - "test: redirect to `/` - 7"
    - "test: redirect to `/` - 8"
    - "test: redirect to `/` - 9 (explicit code still wins)"
  pass_to_pass:
    - "test: redirect to `/` - 1"
    - "test: redirect to `/` - 2"
    - "test: redirect to `/` - 3"
    - "test: redirect to `/` - 4"
    - "test: redirect to `/` - 5"
  near_miss_base: gold               # near-miss corrupts gold-added status tracking
  near_miss:
    - near_miss/nearmiss_rd_useset.py
    - near_miss/nearmiss_rd_always302.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

status:
  semantic_audit: passed
  separability_gate: passed      # instruction = symptom (redirect clobbers preset code); no _hasStatusCode/flag/reply.js leakage
  executable_gate: passed        # mat_fs_rd_3: 4/4 gates, 2 near-miss caught (useset + always302)
  intervention_preflight: pending

notes: >
  New fastify_reply_api family (6th family). Single-node consistency task: redirect() always
  forced 302, clobbering a caller-set status code. gold tracks whether code() was called and
  reuses res.statusCode in the string-arg (no-explicit-code) redirect branch; explicit numeric
  code still wins. base-fail = `code(307).redirect('/')` responds 302 not 307. gold-pass = 307
  preserved + explicit-overwrite still 302. Two near-misses (always-use-preset + always-302)
  fail opposite assertions. Small 4-line source patch — feasibility-blessed.
