[project]
name = "codegraphcl"
version = "0.1.0"
description = "Unified CLI for CodeGraphCL task construction + intervention (phase1 protocol-v1)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
codegraphcl = "codegraphcl.__main__:main"

[tool.setuptools]
packages = ["codegraphcl"]
