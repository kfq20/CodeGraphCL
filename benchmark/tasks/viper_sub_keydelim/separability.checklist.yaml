# Separability checklist for viper_sub_keydelim (viper_sub family, standalone).
schema_version: 1
task_id: viper_sub_keydelim

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the sub-viper does NOT inherit that delimiter... keyed lookups on the
      sub-viper that rely on the custom delimiter fail." Acceptance: sub-viper inherits parent's
      key delimiter.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid subv.keyDelim/v.keyDelim/keyDelim?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction describes the propagation behaviorally"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming viper.go?"
    answer: yes
    evidence: "instruction says 'the sub-viper construction path inside Sub()'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = copy a different parent field (configName) — plausible 'propagate a parent field',
      wrong one; B = reversed assignment direction — plausible 'set the delimiter', backwards.
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A leaves subv.keyDelim empty by copying the wrong field; B leaves subv.keyDelim empty by
      overwriting the parent instead. Both fail because subv.keyDelim is unset, via different
      incorrect logic.
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "1-line patch. base-fail verified (subv.Get returns nil, expected 01/02/03)."
