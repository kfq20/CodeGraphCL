mechanism_audit:
  reusable_decision: >
    Producer: SSLConfig constructor type acceptance. The decision: the verify parameter should
    accept not just str (CA path) and bool (enable/disable verification), but also a pre-built
    ssl.SSLContext. When an SSLContext is passed, stash it directly and set verify=True (assume
    the caller configured it), then load client certs into it via a shared helper.
  plausible_path_correct: >
    In __init__, check isinstance(verify, ssl.SSLContext). If so, stash it as ssl_context,
    set verify=True, and call _load_client_certs(ssl_context) to load client certs. Extract
    the cert-loading logic into a _load_client_certs method (DRY) so both the pre-built-context
    path and the normal load_ssl_context path share it.
  plausible_path_competing: >
    Accept the SSLContext and set verify=True, but don't stash it as ssl_context (leave ssl_context
    as None). This "accepts" the type but doesn't actually use the passed-in context — the caller's
    custom configuration is lost. Looks correct (the type is accepted, verify is True) but the
    ssl_context attribute is None instead of the passed context. Alternatively, stash the context
    but don't set verify=True (leave it as the SSLContext object), breaking the verify attribute
    contract.
  why_instruction_does_not_disambiguate: >
    The instruction says the symptom (passing a pre-built SSL context as the verify argument raises
    a TypeError) and the expectation (accept it and use it as-is). It does NOT name isinstance,
    _load_client_certs, the verify=True default, or the DRY refactor.
  why_correct_history_selects_path: >
    The shared-helper approach is correct because the pre-built SSLContext still needs client
    certs loaded (the caller may have set up the context but not the certs). The DRY refactor
    ensures both paths share the same cert-loading logic.
  why_wrong_history_is_plausible: >
    "Just accept the SSLContext and use it directly" is a reasonable minimal fix that doesn't
    handle client cert loading.

status:
