schema_version: 1
task_id: fastify_clean_schema_id
family_id: fastify_schemas

repository:
  url: https://github.com/fastify/fastify
  base_commit: 5ffb131e40b9^      # parent of the fix
  gold_commit: 5ffb131e40b9
  language: javascript

instruction:
  path: instruction.md

environment:
  image: codegraphcl-fastify:node
  dockerfile: harbor_task/environment/Dockerfile.fastify
  workdir: /workspace/repo
  build_timeout_sec: 900
  extra_mounts: {}

patches:
  gold: gold.patch                 # lib/schemas.js (cleanId recursive $id strip + oneOf guard)
  verifier: verifier/verifier.patch # test/shared-schemas.test.js (clean-the-$id test)

verifier:
  command: bash verifier/test.sh   # tap test/shared-schemas.test.js --grep 'clean the .id'
  timeout_sec: 300
  hermetic: false
  fail_to_pass:
    - "test: The schema resolver should clean the $id key before passing it to the compiler"
  pass_to_pass: []
  pass_to_pass_not_applicable: true  # the clean-the-$id test is new; no prior strip tests
  near_miss_base: gold
  near_miss:
    - near_miss/nearmiss_cid_shallow.py
    - near_miss/nearmiss_cid_wrongkey.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

status:
  semantic_audit: passed
  separability_gate: passed      # instruction = symptom ($id leaks into route compile); no cleanId/recursion/delete leakage
  executable_gate: passed         # base-fail + gold-pass VERIFIED by hand (RC=1 -> RC=0); pending full materialize-confirm
  verification_tier: release_core   # passed the 4/4 materialize gate + near-miss anti-hardcoding; NOT yet a released node. Final publish requires alternative-correct implementation controls (>=1 plausible-but-different patch that also passes the verifier) to rule out trivial-shape solutions.
  intervention_preflight: pending

notes: >
  Second node in fastify_schemas family. Single-node bug fix: shared schema's $id leaked into
  the route schema tree at compile time. gold adds cleanId() — recursively walk the schema
  object deleting $id, called on the route schemas before compilation. base-fail VERIFIED (the
  clean-the-$id test fails on base, RC=1). gold-pass VERIFIED (passes after gold, RC=0). Two
  near-miss (shallow no-recursion + wrong-key 'id' not '$id') re-fail. 11-line source patch —
  feasibility-blessed.
