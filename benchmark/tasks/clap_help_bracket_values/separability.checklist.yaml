# Separability checklist for clap_help_bracket_values (single-node, clap_help_render family).
schema_version: 1
task_id: clap_help_bracket_values

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom (help shows required when parser accepts fewer), not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the help text renders ALL value names as required... The value names
      past the minimum should be rendered as optional (square brackets)."
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid min_vals/is_past_min/is_optional_val/val_names/stylize_arg_suffix?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'argument-to-string rendering surface'"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming arg.rs/help.rs?"
    answer: yes
    evidence: "instruction says 'the argument-to-string rendering surface'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong, not absurd?"
    answer: yes
    evidence: >
      A = bracket the FIRST value instead of the ones past minimum (real off-by-one);
      B = bracket ALL values (real 'make everything optional' over-generalization).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A brackets the wrong value (first instead of past-min); B brackets all values
      (including the minimum). Different bracket-position error.
  - id: S6_base_solvable_and_feasible
    question: "Is the base solvable and comfortably under the agent time budget?"
    answer: yes
    evidence: "19-line source patch. Snapshot test (partially_optional_value_names)."

edge_strength: n/a_single_node
