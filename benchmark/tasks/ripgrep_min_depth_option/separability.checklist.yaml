    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: "A = off-by-one (depth == min not >=); B = no-descend (skip the dir visit only). Both real plausible mistakes."
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: "A = wrong comparison (==); B = wrong visit site (non-dir only). Both leave shallow entries present, different residual."
