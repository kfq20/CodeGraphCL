mechanism_audit:
  reusable_decision: >
    Producer: query parameter value type coercion. The decision: when building query params from
    a dict, primitive values (bool, int, float, None) must be coerced to strings using JSON-style
    conventions (True -> "true", False -> "false", None -> "") rather than Python str() defaults
    (True -> "True", None -> "None"). This matches how web frameworks and HTTP clients expect
    booleans and nulls to be serialized.
  plausible_path_correct: >
    Add a str_query_param(value) utility that checks: if True -> "true", if False -> "false",
    if None -> "", else str(value). Use it in QueryParams.__init__ instead of str(v) for both
    _list and _dict. Also add PrimitiveData type alias and update QueryParamTypes union.
  plausible_path_competing: >
    Handle only booleans (True -> "true", False -> "false") but leave None as str(None) -> "None".
    This fixes the boolean case but produces "a=None" for None values, which should be "a=".
    Looks correct (booleans are the most visible issue) but misses None handling.
  why_instruction_does_not_disambiguate: >
    The instruction says the symptom (boolean query params render as Python str "True"/"False"
    instead of lowercase "true"/"false") and the expectation (use lowercase for booleans).
    It does NOT name str_query_param, the None->"" rule, or which file the coercion belongs in.
  why_correct_history_selects_path: >
    The JSON-style convention (true/false/null) is the web standard for query param serialization.
    Handling None as empty string matches RFC 3986 (a key with no value).
  why_wrong_history_is_plausible: >
    "Just fix the boolean rendering" is a reasonable minimal fix that addresses the most visible
    symptom.

status:
