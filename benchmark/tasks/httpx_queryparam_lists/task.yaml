    - near_miss/nearmiss_str_flatten.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: query parameter list/tuple flattening. The decision: when a dict mapping is passed
    to QueryParams, list/tuple values (not str/bytes) must be flattened into multiple key-value
    pairs (e.g. {"tag": ["python", "dev"]} -> [("tag", "python"), ("tag", "dev")]), matching the
    HTTP convention for repeated query params. str and bytes values are treated as single values
    (not iterated).
  plausible_path_correct: >
    Add a flatten_queryparams(queryparams) utility that iterates the dict: for each (k, v), if v is
    a collections.abc.Sequence and not str/bytes, iterate and append (k, item) for each; else
    append (k, v). Use it in QueryParams.__init__ for the dict branch. Also update QueryParamTypes
    to accept Union[PrimitiveData, Sequence[PrimitiveData]] values.
  plausible_path_competing: >
    Flatten lists but not tuples. Check isinstance(v, list) but forget tuples. This handles the
    most common case (dicts with list values) but raises TypeError for tuple values.
    Looks correct (lists are the common case) but misses tuples. The alternative competing path
    flattens correctly but corrupts the key (e.g. uppercasing), producing wrong query param names.
  why_instruction_does_not_disambiguate: >
    The instruction says the symptom (passing a dict with list values for a key raises TypeError
    instead of producing repeated query params) and the expectation (flatten list values into
    multiple key-value pairs). It does NOT name flatten_queryparams, the collections.abc check,
    or the str/bytes exclusion.
  why_correct_history_selects_path: >
    The Sequence ABC check (with str/bytes exclusion) is the correct approach because it handles
    both lists and tuples generically while avoiding the pitfall of iterating string characters.
  why_wrong_history_is_plausible: >
    "Just check for lists" is a reasonable minimal fix that addresses the most common case.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: passed         # materialized 4/4 (agent-built, verified)
  verification_tier: executable_candidate
  intervention_preflight: pending

notes: >
