schema_version: 1
edge_id: fastify_hasheader_to_removeheader
from: fastify_reply_hasheader
to: fastify_reply_removeheader
edge_type: beneficial_update

# The producer (31c5f7e259d1) added hasHeader/getHeader and established the header-accessor
# convention: (1) lowercase the key (case-insensitive), (2) return this (fluent chaining). The
# consumer (cfa760cbd129, add .removeHeader()) adds a third accessor and must follow BOTH halves.
# Notably, the consumer task's near-miss injectors are literally "don't lowercase" and "don't
# return this" — the two halves of the carried convention — so the near-miss design independently
# confirms the edge's mechanism.
experience:
  statement: >
    The reply's header accessors follow two rules: header names are case-insensitive, so every
    accessor normalizes the key to lowercase before touching the internal store; and accessors
    return the reply itself (this) for fluent chaining. Any new accessor on the reply's header
    surface should follow both halves — lowercase the key, and return this.
  type: header_accessor_convention
  scope: lib/reply.js
  provenance:
    repository: fastify
    commit: 31c5f7e259d1          # producer
  validity: valid_for_consumer    # both halves transfer to removeHeader

conditions:
  reset: null
  correct: correct                # the lowercase + return-this convention
  irrelevant: irrelevant
  stale: wrong                    # case-sensitive storage, no chaining contract

expected_effect:
  correctness: possible           # an agent following the stale atom skips lowercasing and/or returning this
  efficiency: possible
  negative_transfer: possible

status:
  semantic_audit: passed
  causal_verification: proposed   # both nodes executable_verified (mat_fs_hh_1, mat_fs_rh_1); intervention pending
