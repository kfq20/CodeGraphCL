    - near_miss/nearmiss_silent_return.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: Headers.__delitem__ must conform to the MutableMapping contract — raise KeyError(key)
    when the key is absent, matching dict semantics. Downstream, RedirectMiddleware previously used
    `del headers[...]` to strip Authorization/Content-Length/Transfer-Encoding on cross-origin or
    method-change redirects; those deletes must become tolerant `headers.pop(..., None)` calls so
    the new (correct) KeyError does not break redirect handling when the header was already absent.
  plausible_path_correct: >
    In __delitem__, after collecting pop_indexes, `if not pop_indexes: raise KeyError(key)`.
    Update redirect middleware to use headers.pop(name, None) for the three stripped headers so
    redirect stripping tolerates a now-correctly-absent header.
  plausible_path_competing: >
    Raise an error but of the wrong type (e.g. ValueError) — "raise something when the header is
    missing" — looks reasonable but does not satisfy pytest.raises(KeyError).
  why_instruction_does_not_disambiguate: >
    The instruction states the symptom (silent no-op vs KeyError on absent key), the expectation
    (match dict semantics, raise KeyError), and that redirect strippers must tolerate absence. It
    does NOT name pop_indexes, the `if not pop_indexes` guard, or the headers.pop refactor.
  why_correct_history_selects_path: >
    KeyError is the standard Python mapping protocol for missing keys (dict, collections.abc).
    Tolerant pop in the redirect stripper is the minimal adaptation that preserves redirect behavior.
  why_wrong_history_is_plausible: >
    "Raise some error" and "silently no-op" are both common reactions to a missing-key delete; the
    MutableMapping contract is easy to overlook.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: passed         # materialized 4/4 (base-fail, gold-pass, 2 near-miss caught)
  verification_tier: release_core   # evidence: 2 near-miss (alt-impl), fail_to_pass=True, pass_to_pass_NA, checklist=yes, mechanism_audit=yes
  intervention_preflight: pending

notes: >
  httpx_headers family (standalone). Motif: protocol-conformance (MutableMapping.__delitem__ must
  raise KeyError on absent key). 9-line source patch (httpx/models.py + httpx/middleware.py).
  Commit 0f34f3b (#324). The http2.py import reorder in the original commit is cosmetic and
  unrelated to the test, but is included in the gold patch for fidelity.
