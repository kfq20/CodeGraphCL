    - near_miss/nearmiss_wrong_field.py
    - near_miss/nearmiss_reversed.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: Viper.Sub(key) builds a sub-viper that must inherit the parent's configuration
    context. The decision: the custom key delimiter (keyDelim) is one of the parent's fields that
    must be copied into the sub-viper so that keyed lookups on the sub-viper honor the same
    delimiter as the parent.
  plausible_path_correct: >
    In Sub(), alongside the existing copied fields (automaticEnvApplied, envPrefix,
    envKeyReplacer), add `subv.keyDelim = v.keyDelim` before returning the sub-viper.
  plausible_path_competing: >
    Copy a different parent field into the sub-viper, or assign in the reversed direction
    (parent <- sub), both of which look like "propagate a delimiter-related field" but leave
    subv.keyDelim at its empty default.
  why_instruction_does_not_disambiguate: >
    The instruction states the symptom (sub-viper does not honor the custom delimiter), the
    expectation (sub-viper inherits the parent's key delimiter), and that the fix belongs in the
    sub-viper construction path inside Sub(). It does NOT name keyDelim, the assignment, or which
    existing copied fields sit next to it.
  why_correct_history_selects_path: >
    keyDelim is the field that stores the configured delimiter; copying it parent->sub is the
    minimal change that makes the sub-viper honor the same delimiter, mirroring how the other
    parent fields are already propagated.
  why_wrong_history_is_plausible: >
    "Copy a parent field into the sub" and "set the delimiter on the sub" are both reasonable
    framings; copying the wrong field or reversing the assignment are easy mistakes.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: passed         # materialized 4/4 (base-fail, gold-pass, 2 near-miss caught)
  verification_tier: release_core   # evidence: 2 near-miss (alt-impl), fail_to_pass=True, pass_to_pass_NA, checklist=yes, mechanism_audit=yes
  intervention_preflight: pending

notes: >
