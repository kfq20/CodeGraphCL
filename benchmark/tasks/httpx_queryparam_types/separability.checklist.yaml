# Separability checklist for httpx_queryparam_types (httpx_queryparams family, node 1).
schema_version: 1
task_id: httpx_queryparam_types

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "boolean values are rendered using Python's default str() representation:
      True -> True, False -> False." Acceptance: coerce to lowercase strings.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid str_query_param/PrimitiveData/QueryParamTypes?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction describes the coercion behaviorally"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming models.py/utils.py?"
    answer: yes
    evidence: "instruction says 'the coercion utility and the query param construction'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = handle booleans but not None (booleans are the visible symptom, None is edge case);
      B = handle None as the string "None" instead of "" (plausible str() default for None).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails on the None test case (str(None) -> "None" != ""); B fails on the None test case
      (returns "None" instead of ""). Both wrong on None, but via different incorrect logic.
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "26-line patch. base-fail verified (a=True instead of a=true)."
