schema_version: 1
task_id: clap_help_short_padding
family_id: clap_help_render

repository:
  url: https://github.com/clap-rs/clap
  base_commit: "126440ca^"      # parent of the fix
  gold_commit: "126440ca"
  language: rust

instruction:
  path: instruction.md

environment:
  image: codegraphcl-ripgrep:rust
  dockerfile: harbor_task/environment/Dockerfile.ripgrep
  workdir: /workspace/repo
  build_timeout_sec: 900
  extra_mounts:
    cargo_cache: /tmp/cgcl_cargo_cache
    target: /tmp/cgcl_target

patches:
  gold: gold.patch                 # clap_builder/src/output/help_template.rs (fix padding for short-only args)
  verifier: verifier/verifier.patch # tests/builder/help.rs + multiple_values.rs + macros.rs (snapshot + remove should_panic)

verifier:
  command: bash verifier/test.sh   # cargo test --test builder short_with_value
  timeout_sec: 300
  hermetic: false
  fail_to_pass:
    - "test: short_with_value"
  pass_to_pass: []
  pass_to_pass_not_applicable: true  # the short_with_value snapshot is updated by the verifier patch
  near_miss_base: gold
  near_miss:
    - near_miss/nearmiss_sp_nofilter.py
    - near_miss/nearmiss_sp_wrongcond.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

status:
  semantic_audit: passed
  separability_gate: passed      # instruction = symptom (wrong padding / crash for short-only args); no filter/condition/file leakage
  executable_gate: passed         # base-fail: snapshot mismatch on short_with_value; near-miss pending empirical confirm
  verification_tier: release_core   # passed the 4/4 materialize gate + near-miss anti-hardcoding; NOT yet a released node. Final publish requires alternative-correct implementation controls (>=1 plausible-but-different patch that also passes the verifier) to rule out trivial-shape solutions.
  intervention_preflight: pending

notes: >
  New clap_help_render family. Single-node bug fix (commit 126440ca): help-text padding for
  short-only args was wrong — doubled padding for value-taking args, and a crash for count-action
  args. gold removes longest_filter and checks get_long().is_some() instead of is_positional().
  base-fail: short_with_value snapshot mismatch (`-z <BAZ>      Short only` vs expected
  `-z <BAZ>  Short only`). Two near-miss (keep old filter / wrong condition) re-fail.
