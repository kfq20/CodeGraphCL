mechanism_audit:
  reusable_decision: >
    Producer: the HTTP case-insensitivity contract for header names (RFC 2616 §4.2) meeting a
    case-SENSITIVE JSON-Schema property lookup. The decision: normalize at schema-preparation time —
    re-key the header schema's property map to the case the runtime actually delivers (lower) before
    compiling — rather than normalizing at request time or asking users to spell headers lower-case.
    Normalizing on a copy keeps the user's schema object unmutated.
  plausible_path_correct: >
    Where a route's schemas are prepared for validation, copy the header schema's own keys onto a
    fresh object, then re-key its properties map with lower-cased names, and compile the copy. The
    properties branch is guarded so schemas without properties are untouched.
  plausible_path_competing: >
    Normalize the other direction — lower-case (or otherwise rewrite) the incoming request's header
    keys to match whatever the schema declares, or leave it to the user to spell schema keys in
    lower case. Looks correct (the request is the thing that "arrived in the wrong case") but the
    runtime's lower-cased header keys are the canonical form; rewriting requests to fit the schema
    inverts the contract and cannot resolve two schemas declaring the same header in different cases.
  why_instruction_does_not_disambiguate: >
    The instruction states the symptom (a header schema is silently skipped unless spelled lower
    case, so a declared type never coerces) and the expectation (all spellings must match, and
    property-less schemas plus other schema keywords must survive). It does NOT name the schema
    copy, the properties re-key, the lower-casing, or which side of the comparison to normalize —
    a reset agent cannot tell whether to touch the schema, the request, or the compiler.
  why_correct_history_selects_path: >
    The case-insensitivity contract, combined with the fact that the runtime hands over already
    lower-cased header names, selects lower-casing the SCHEMA's property keys: the request side is
    already canonical, so the schema is the side that must be normalized to it.
  why_wrong_history_is_plausible: >
    The wrong prior — "the schema is the user's declaration of truth; normalize the incoming request
    to match it" — is a common validation-layer instinct and is not absurd; it merely picks the
    wrong side of an asymmetry that only the HTTP contract resolves.

status:
