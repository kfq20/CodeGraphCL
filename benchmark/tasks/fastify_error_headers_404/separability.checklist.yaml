# Separability checklist for fastify_error_headers_404 (fastify_error_lifecycle, Phase 4).
schema_version: 1
task_id: fastify_error_headers_404

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the not-found handler's response is sent WITHOUT the error's custom
      headers." Acceptance: apply headers before the not-found handler sends the response.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid error.headers/reply.headers(error.headers)/error.status===404/notFound?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'the reply's error-handling path'"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming reply.js?"
    answer: yes
    evidence: "instruction says 'the reply's error-handling path'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = don't move the headers call (real 'the original position is fine for non-404'
      incomplete fix); B = move but to the wrong branch — inside error.status>=400 but after
      the 404 return (real 'I moved it into the status block' misplacement).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails via headers-set-after-notFound (not moved at all); B fails via headers-set-after-404-return
      (moved but to wrong branch). Both x-foo missing, different reason.
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "4-line source move. base-fail expected (404 response sent without error's custom headers)."
