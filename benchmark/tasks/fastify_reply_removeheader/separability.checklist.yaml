# Separability checklist for fastify_reply_removeheader (single-node, fastify_reply_api family).
# Instruction states the symptom (no way to remove a set header); the fix (delete the lowercased
# key from the header store, return this for fluent chaining) must be derived.
schema_version: 1
task_id: fastify_reply_removeheader

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom (can't remove a header), not the fix?"
    answer: yes
    evidence: >
      instruction.md: "there is no method to do so; the header remains." Acceptance: remove a
      previously-set header; removal of an unset header is a no-op; case-insensitive.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid removeHeader / _headers / delete / toLowerCase?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'remove' and 'drop' generically"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming reply.js / Reply.prototype?"
    answer: yes
    evidence: "instruction says 'the reply's header surface'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong, not absurd?"
    answer: yes
    evidence: >
      A = delete correctly but don't return this (real 'removal is void' assumption); B = blank
      the value not delete the key (real 'clear the value' assumption).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails the chaining assertion (return value); B fails the read-back assertion (returns ''
      not undefined). Different assertion. Both empirically verified rc=1.
  - id: S6_base_solvable_and_feasible
    question: "Is the base solvable and comfortably under the agent time budget?"
    answer: yes
    evidence: "13-line feature-add. base-fail verified by hand (BF_RC=1)."

edge_strength: n/a_single_node
