    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: "A = missing the inner-loop poison check (runtime visitor panic still hangs); B = missing the Drop poison-on-unwind (a worker that panics doesn't poison). Different failure mode, same hang."
