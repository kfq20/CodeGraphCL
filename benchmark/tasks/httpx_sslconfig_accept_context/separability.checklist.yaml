# Separability checklist for httpx_sslconfig_accept_context (httpx_ssl_config family).
schema_version: 1
task_id: httpx_sslconfig_accept_context

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "passing a pre-built ssl.SSLContext object as verify= raises a
      TypeError." Acceptance: accept it, stash it, set verify=True, load client certs.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid isinstance/_load_client_certs/load_cert_chain?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction describes type acceptance behaviorally"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming config.py?"
    answer: yes
    evidence: "instruction says 'the SSL configuration module'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = accept SSLContext but don't set verify=True (leave it as the SSLContext object, plausible
      "verify should reflect what they passed"); B = accept SSLContext, set verify=True, but don't
      stash ssl_context (leave it None, plausible "I set verify, the context is implicit").
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails on the verify attribute check (verify is SSLContext, not True); B fails on the
      ssl_context identity check (ssl_context is None, not the passed context).
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "42-line patch. base-fail verified (TypeError on SSLContext verify)."
