# Separability checklist for httpx_headers_keyerror (httpx_headers family, standalone).
schema_version: 1
task_id: httpx_headers_keyerror

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "deleting a key that is not present silently does nothing, whereas a standard
      mapping raises KeyError." Acceptance: raise KeyError(key) on absent key.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid pop_indexes/raise KeyError/headers.pop/__delitem__?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction describes the contract behaviorally"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming models.py/middleware.py?"
    answer: yes
    evidence: "instruction says 'the Headers mapping implementation; redirect middleware that strips headers'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: >
      A = raise ValueError instead of KeyError (plausible 'raise an error', wrong type);
      B = silently return on missing key (plausible 'missing header should no-op', violates contract).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails because pytest.raises(KeyError) does not catch ValueError (wrong exception type);
      B fails because no exception is raised at all (silent no-op). Both miss KeyError, via different
      incorrect logic.
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "9-line patch. base-fail verified (del headers['baz'] returns normally, no KeyError)."
