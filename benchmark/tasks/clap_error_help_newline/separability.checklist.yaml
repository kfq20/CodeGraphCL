# Separability checklist for clap_error_help_newline (single-node, clap_error family).
# Instruction states the symptom (help/subcommand error has no trailing newline); the fix
# (add an else { c.none("\n") } branch) must be derived.
schema_version: 1
task_id: clap_error_help_newline

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the resulting error message string does not end with a trailing newline."
      Acceptance: make it end with a newline, consistent with other clap errors.
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid \\n / c.none( / else { / errors.rs / ends_with?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'trailing newline' generically"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming src/parse/errors.rs?"
    answer: yes
    evidence: "instruction says 'the clap error-formatting surface'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong, not absurd?"
    answer: yes
    evidence: >
      A = remove the else branch (real 'help-enabled path already has a newline, skip disabled'
      assumption); B = add the newline in the if-branch instead (real 'ensure a newline' applied
      to the wrong branch).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A removes the newline entirely (base behavior); B keeps a newline but in the wrong branch
      (help-enabled gets a double newline, disabled gets none). Different residual state.
  - id: S6_base_solvable_and_feasible
    question: "Is the base solvable and comfortably under the agent time budget?"
    answer: yes
    evidence: "2-line source patch. base-fail verified by hand (BF_RC=101)."

edge_strength: n/a_single_node
