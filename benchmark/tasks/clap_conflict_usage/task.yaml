schema_version: 1
task_id: clap_conflict_usage
family_id: clap_conflict

repository:
  url: https://github.com/clap-rs/clap
  base_commit: 578cd43a^
  gold_commit: 578cd43a
  language: rust

instruction:
  path: instruction.md

environment:
  image: codegraphcl-ripgrep:rust
  dockerfile: harbor_task/environment/Dockerfile.ripgrep
  workdir: /workspace/repo
  build_timeout_sec: 900
  extra_mounts:
    cargo_cache: /tmp/cgcl_cargo_cache
    target: /tmp/cgcl_target

patches:
  gold: gold.patch                 # clap_builder/src/parser/validator.rs + flat_set.rs
  verifier: verifier/verifier.patch # tests/builder/groups.rs (conflict_with_group snapshot)

verifier:
  command: bash verifier/test.sh   # cargo test --test builder conflict_with_group
  timeout_sec: 300
  hermetic: false
  fail_to_pass:
    - "test: groups::conflict_with_group"
  pass_to_pass: []
  pass_to_pass_not_applicable: true
  near_miss_base: gold
  near_miss:
    - near_miss/nearmiss_cu_nodedup.py
    - near_miss/nearmiss_cu_dedupwrongstep.py

separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: the conflict-error usage-string rule — the usage line in a conflict error lists
    each conflicting argument only once, deduped. Dedup must happen on the conflict IDS before
    the usage builder consumes them (not on the rendered strings after).
  plausible_path_correct: >
    Collect conflict_ids into a FlatSet (dedup) -> into_vec -> map to strings -> pass the
    deduped &conflict_ids to build_conflict_err_usage.
  plausible_path_competing: >
    Pass raw conflict_ids to the usage builder (no dedup), or dedup the rendered strings after
    mapping (the builder still reads raw ids). Both leave duplicates in the usage line.
  why_instruction_does_not_disambiguate: >
    The instruction says the symptom (usage line lists both args) and the expectation (dedup,
    list each once). It does NOT name FlatSet, the collect-then-map order, or where the dedup
    must happen relative to the usage builder.
  why_correct_history_selects_path: >
    The dedup-must-precede-the-usage-builder rule points at the collect-FlatSet-then-map path.
  why_wrong_history_is_plausible: >
    The wrong priors ("the builder handles uniqueness" / "dedup the output strings") are real
    plausible principles — each is a misplaced dedup.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: pending        # base-fail VERIFIED (BF2_RC=101); near-miss BLOCKED:
                                  # nearmiss A (nodedup) passes under gold (didn't actually skip dedup —
                                  # both gold and A pass &Vec to builder); nearmiss B (Vec-not-FlatSet)
                                  # inject_failed. Need near-miss that genuinely re-introduces dup ids in
                                  # the usage string. Marked pending near-miss per 2h cap.
  verification_tier: executable_candidate
  intervention_preflight: pending

notes: >
  New clap_conflict family. Motif: precedence (dedup order: ids before usage build, not strings
  after). base-fail VERIFIED (conflict_with_group: expects --conflict, base renders --a --conflict).
  17-line source patch. Phase 4 task.
