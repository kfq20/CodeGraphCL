# Separability checklist for fastify_reply_headerssent (single-node, fastify_reply_api family).
# Instruction states the symptom (send stream after manual writeHead crashes); the fix (guard
# the header loop with !res.headersSent, warn otherwise) must be derived.
schema_version: 1
task_id: fastify_reply_headerssent

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom (manual-headers-then-stream crash), not the fix?"
    answer: yes
    evidence: >
      instruction.md: "the send step throws an error because it tries to set headers again on a
      response whose headers have already been sent." Acceptance: don't re-set headers when
      already sent (may warn).
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid headersSent / res.setHeader / reply._headers / writeHead / for (var key?"
    answer: yes
    evidence: "banned_words.txt forbids these; instruction says 'underlying response object's write-headers method' generically"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming reply.js?"
    answer: yes
    evidence: "instruction says 'the reply send implementation'"
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong, not absurd?"
    answer: yes
    evidence: >
      A = invert the guard polarity (real misread); B = add the warning but run the loop
      unconditionally (real 'warn wired, guard on the loop body forgotten' incomplete fix).
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: >
      A fails the NORMAL case (headers never set); B fails the WRITEHEAD case (loop crashes after
      headers sent). Different failing case.
  - id: S6_base_solvable_and_feasible
    question: "Is the base solvable and comfortably under the agent time budget?"
    answer: yes
    evidence: "8-line source patch. base-fail verified by hand (BF_RC=1)."

edge_strength: n/a_single_node
