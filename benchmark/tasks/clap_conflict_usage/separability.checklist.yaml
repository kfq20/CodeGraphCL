# Separability checklist for clap_conflict_usage (clap_conflict, Phase 4).
schema_version: 1
task_id: clap_conflict_usage

checks:
  - id: S1_instruction_symptom_only
    question: "Does the instruction state only the symptom, not the fix?"
    answer: yes
    evidence: "instruction.md: usage line lists both args; should list only the non-triggering arg. Acceptance: dedup."
  - id: S2_instruction_no_mechanism_words
    question: "Does the instruction avoid FlatSet/collect::FlatSet/into_vec/seen.insert/conflict_ids/validator.rs?"
    answer: yes
    evidence: "banned_words.txt forbids; instruction says 'argument-validation / conflict-error construction surface'"
  - id: S3_instruction_no_file_names
    question: "Does the instruction avoid naming validator.rs/groups.rs?"
    answer: yes
  - id: S4_near_misses_plausible
    question: "Are the near-misses plausible-but-wrong?"
    answer: yes
    evidence: "A = 'builder handles uniqueness' (real misplaced-trust); B = 'dedup the strings' (real misplaced-dedup)."
  - id: S5_near_misses_distinct_axes
    question: "Do the near-misses fail along distinct axes?"
    answer: yes
    evidence: "A = no dedup at all (raw ids); B = dedup at wrong step (Vec not FlatSet). Both leave dups in usage."
  - id: S6_base_solvable
    question: "Is the base solvable?"
    answer: yes
    evidence: "17-line patch. base-fail verified (BF2_RC=101, conflict_with_group snapshot mismatch)."
