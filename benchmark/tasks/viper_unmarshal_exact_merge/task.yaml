separability:
  banned_words: banned_words.txt
  checklist: separability.checklist.yaml

mechanism_audit:
  reusable_decision: >
    Producer: UnmarshalExact must surface environment-variable values for struct fields when
    AutomaticEnv is enabled, while still erroring on unused fields. The decision: derive the
    struct-field keys from the destination struct and decode from the env-aware settings lookup
    (getSettings) over the union of all known keys plus the struct-derived keys, rather than the
    static all-settings map.
  plausible_path_correct: >
    In UnmarshalExact, call decodeStructKeys(rawVal, opts...) to get struct-field keys, then
    `decode(v.getSettings(append(v.AllKeys(), structKeys...)), config)` (config already has
    ErrorUnused=true).
  plausible_path_competing: >
    Derive the struct keys but keep decoding from AllSettings() (env layer never consulted), OR
    call getSettings but drop structKeys from the lookup set (env vars shadowed by struct names
    are still missed).
  why_instruction_does_not_disambiguate: >
    The instruction states the symptom (env-backed fields zero after UnmarshalExact), the
    expectation (derive struct keys, feed into env-aware lookup, keep the unused-field error), and
    that the fix belongs in UnmarshalExact's decode-source selection. It does NOT name
    decodeStructKeys, getSettings, or the append union.
  why_correct_history_selects_path: >
    getSettings is the layer that consults env vars per-key; unioning struct-derived keys with
    AllKeys() ensures every struct field is looked up through the env-aware path, while keeping
    ErrorUnused preserves the exact-mode contract.
  why_wrong_history_is_plausible: >
    "Add a struct-key derivation step" and "use the env-aware getter" are both reasonable partial
    framings; each alone leaves the env var unconsulted.

status:
  semantic_audit: passed
  separability_gate: passed
  executable_gate: passed         # materialized 4/4 (base-fail, gold-pass, 2 near-miss caught)
  verification_tier: release_core
  intervention_preflight: pending

notes: >
  viper_unmarshal family (standalone). Motif: env-layer-surfacing for UnmarshalExact (derive struct
  keys, decode via getSettings). 8-line source patch (viper.go). Commit fb6eb1e. Builds on 73dfb94
  (Unmarshal) which introduced decodeStructKeys/getSettings; this task applies the same pattern to
  UnmarshalExact. base = f5fcb4a (parent of fb6eb1e) which already has 73dfb94's machinery.
